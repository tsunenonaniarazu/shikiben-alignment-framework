name: Shikiben V2.6.0 CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  # ===================================================================
  # Job 1: 構文チェック・単体回帰テスト・数値シミュレーション検分
  # ===================================================================
  verify-core-and-simulations:
    name: Core & Simulation Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Core & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio numpy matplotlib aiohttp==3.9.5 pynvml==11.5.0

      - name: Step 1 - AST Syntax & Undefined Name Check (Ruff)
        run: |
          # E9: 構文エラー, F63: 無効な比較, F7: 制御構文エラー, F82: 未定義変数の参照
          ruff check . --select=E9,F63,F7,F82 --target-version=py310

      - name: Step 2 - Bytecode Compilation Check (py_compile)
        run: |
          python -m py_compile src/shikiben_trm_v26.py
          python -m py_compile sidecar/trm_proxy.py sidecar/hardware_harvester_v2.py
          python -m py_compile simulations/v26_canonical/*.py
          python -m py_compile tests/test_trm_v26_benchmark.py

      - name: Step 3 - Run Automated Regression Suite (pytest)
        run: |
          pytest tests/test_trm_v26_benchmark.py -v --tb=short

      - name: Step 4 - Execute Reference Emulator & Canonical Simulations (Headless)
        run: |
          python src/shikiben_trm_v26.py
          python simulations/v26_canonical/09_full_stack_shikiben_v26.py
          python simulations/v26_canonical/10_breathing_anchor_full_stack_v26.py
          python simulations/v26_canonical/11_human_meta_damping_v26.py
          test -f shikiben_v260_breathing_anchors.png
          test -f shikiben_v260_human_meta_damping.png

      - name: Upload Generated Verification Plots
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: shikiben-v260-verification-plots
          path: "shikiben_v260_*.png"
          retention-days: 14

  # ===================================================================
  # Job 2: TRM-EcoGuard サイドカー コンテナビルド＆エンドポイント疎通検分
  # ===================================================================
  verify-sidecar-container:
    name: TRM-EcoGuard Sidecar Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: verify-core-and-simulations

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build TRM-EcoGuard Sidecar Image
        working-directory: ./sidecar
        run: |
          docker build -f Dockerfile.sidecar -t trm-ecoguard:ci-test .

      - name: Run Sidecar in Mock Mode & Verify Tri-Endpoints
        run: |
          docker run -d --name trm-sidecar-test -p 8000:8000 trm-ecoguard:ci-test
          sleep 3
          # 1. /healthz 内部健全性チェック
          curl -fsS http://localhost:8000/healthz | grep "HEALTHY"
          # 2. /v1/models フォールバック応答チェック
          curl -fsS http://localhost:8000/v1/models | grep "trm-ecoguard-sidecar"
          # 3. /metrics Prometheus 航法計器 (律) 出力チェック
          curl -fsS http://localhost:8000/metrics | grep "alignment_drift_local_norm"
          docker stop trm-sidecar-test
